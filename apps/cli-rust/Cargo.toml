[package]
name = "coagent"
version = "1.0.0"
edition = "2024"
authors = ["Henrique Carmellim <henrique@coagent.dev>"]
description = "CoAgent — Framework Nativo de Orquestração Multiagente de IA (CLI em Rust)"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
colored = "3.0"
indicatif = { version = "0.17", features = ["tokio"] }
comfy-table = "7.1"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
futures-util = "0.3"
